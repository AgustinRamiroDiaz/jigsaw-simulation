[package]
name = "trace-viewer"
version = "0.1.0"
edition = "2024"

[dependencies]
iced = { version = "0.14", features = ["canvas", "fira-sans", "image-without-codecs", "tokio", "webgl"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
jigsaw-simulation = { path = ".." }

[target.'cfg(target_arch = "wasm32")'.dependencies]
futures-channel = "0.3"
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "Blob",
    "Document",
    "Element",
    "Event",
    "EventTarget",
    "File",
    "FileList",
    "HtmlElement",
    "HtmlInputElement",
    "Node",
    "Window",
] }

[package]
name = "trace-viewer"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = "0.34"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
jigsaw-simulation = { path = ".." }
web-time = "1.1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1"
console_log = "1"
futures-channel = "0.3"
js-sys = "0.3"
log = "0.4"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "Blob",
    "Document",
    "Element",
    "Event",
    "EventTarget",
    "File",
    "FileList",
    "HtmlCanvasElement",
    "HtmlElement",
    "HtmlInputElement",
    "Node",
    "Window",
] }
